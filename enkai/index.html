<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宴会仕込みナビ</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#243047;background:#f6f7fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:20px 16px 48px}
header{padding:12px 4px 20px}h1{margin:0;font-size:28px}p{color:#657086}
.card{background:white;border:1px solid #e5e8ef;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0000000a}
label{font-weight:700;display:block;margin:10px 0 7px}
input,select,button{width:100%;font:inherit;border-radius:10px;padding:12px;border:1px solid #cdd3df}
input[type=range]{padding:0;accent-color:#3457d5}button{border:0;background:#3457d5;color:#fff;font-weight:800;cursor:pointer;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.value{font-size:30px;font-weight:800;text-align:center;margin:6px}
.result{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{padding:12px;background:#f7f8fc;border-radius:12px}.qty{font-size:20px;font-weight:800}.muted{font-size:13px;color:#70798a}.deadline{font-size:20px;font-weight:800}
.notice{background:#fff7e6;border:1px solid #f1d49a;border-radius:12px;padding:12px;font-size:13px}
@media(max-width:520px){.grid,.result{grid-template-columns:1fr}.wrap{padding:14px 12px 36px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🍱 宴会仕込みナビ</h1><p>人数とコースを選ぶだけ。仕込み量と卸への発注締切の目安を確認できます。</p></header>
<section class="card">
<label for="people">予約人数</label>
<input id="people" type="range" min="5" max="100" value="30" oninput="update()">
<div class="value"><span id="peopleVal">30</span>名</div>
<div class="grid">
<div><label for="course">コース</label><select id="course" onchange="update()"><option value="standard">定番コース</option><option value="premium">上質コース</option><option value="seafood">海鮮コース</option></select></div>
<div><label for="buffer">仕込み余裕</label><select id="buffer" onchange="update()"><option value="1.05">5%余裕</option><option value="1.1">10%余裕</option><option value="1.15">15%余裕</option></select></div>
</div>
<button onclick="update()">仕込み量を計算する</button>
</section>
<section class="card"><h2>仕込み量の目安</h2><div id="results" class="result"></div></section>
<section class="card"><h2>卸への発注</h2><div class="deadline" id="deadline"></div><p id="deadlineText"></p><div class="notice">※締切は一般的な目安です。休市日・配送エリア・卸の営業条件によって異なるため、実際の締切は各仕入先に確認してください。</div></section>
</div>
<script>
const menus={
standard:{deadline:"2営業日前 15:00",items:[["鶏肉","120g/人","kg"],["豚肉","80g/人","kg"],["野菜","180g/人","kg"],["米","90g/人","kg"],["豆腐","60g/人","kg"],["調味料","12g/人","kg"]]},
premium:{deadline:"3営業日前 15:00",items:[["牛肉","100g/人","kg"],["鶏肉","70g/人","kg"],["野菜","200g/人","kg"],["米","90g/人","kg"],["魚介","90g/人","kg"],["調味料","14g/人","kg"]]},
seafood:{deadline:"3営業日前 12:00",items:[["刺身用魚","90g/人","kg"],["魚介","120g/人","kg"],["野菜","180g/人","kg"],["米","90g/人","kg"],["豆腐","50g/人","kg"],["調味料","14g/人","kg"]]}
};
function update(){
 const n=+document.getElementById("people").value,b=+document.getElementById("buffer").value,m=menus[document.getElementById("course").value];
 document.getElementById("peopleVal").textContent=n;
 document.getElementById("results").innerHTML=m.items.map(x=>{const grams=parseFloat(x[1])*n*b/1000;return '<div class="item"><div>'+x[0]+'</div><div class="qty">'+grams.toFixed(1)+' '+x[2]+'</div><div class="muted">'+x[1]+' × '+n+'名 × 余裕'+Math.round((b-1)*100)+'%</div></div>'}).join("");
 document.getElementById("deadline").textContent=m.deadline;
 document.getElementById("deadlineText").textContent=n+"名・"+document.getElementById("course").selectedOptions[0].text+"の場合の発注締切目安です。";
}
update();
</script>
</body>
</html>
